{% extends "base.html" %}
{% load static %}

{% block title %}Forgot Password{% endblock %}

{% block center %}
<div class="d-flex justify-content-center" >
  <div class="card shadow border-primary p-4" style="width: 100%; max-width: 500px;">
    <h2 class="text-center text-primary mb-4">Forgot your password?</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
      </div>
      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Reset Password</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
