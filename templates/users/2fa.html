{% extends "base.html" %}
{% load static %}

{% block title %}Two-Factor Verification{% endblock %}

{% block center %}
<div class="container d-flex justify-content-center " style="min-height: 30vh;">
  <div class="card p-4 shadow-lg" style="max-width: 400px; width: 100%;">
    <h4 class="mb-3 text-center">Two-Factor Authentication</h4>
    <p class="text-muted text-center">Enter the 6-digit code sent to your email.</p>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="code" class="form-label">Verification Code</label>
        <input type="text" class="form-control" id="code" name="code" placeholder="123456" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Verify</button>
    </form>
  </div>
</div>
{% endblock %}
