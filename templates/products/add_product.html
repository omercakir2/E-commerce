{% extends "base.html" %}
{% load static %}

{% block title %}
Add a Product
{% endblock %}

{% block center %}
<div class="d-flex justify-content-center align-items-center" style="width: 100%; height: 100%;">
  <div class="card p-4 shadow" style="width: 100%; max-width: 700px;">
    
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    <h2 class="text-center mb-4">Enter Product Details</h2>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3">
        <label for="name" class="form-label">Product Name</label>
        <input type="text" name="name" id="name" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="price" class="form-label">Price</label>
        <input type="number" step="0.01" name="price" id="price" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea name="description" id="description" class="form-control" rows="4"></textarea>
      </div>

      <div class="mb-3">
        <label for="images" class="form-label">Upload up to 5 Images</label>
        <input type="file" name="images" id="images" class="form-control" accept="image/*" multiple>
        <small class="form-text text-muted">You can upload up to 5 images.</small>
      </div>

      <button type="submit" class="btn btn-success w-100">Submit Product</button>
    </form>
  </div>
</div>
{% endblock %}
