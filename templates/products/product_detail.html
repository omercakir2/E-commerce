{% extends "base.html" %}
{% load static %}

{% block title %}{{ product.name }}{% endblock %}

{% block center %}
<div class="container mt-5">
  <div class="row">
    <div class="col-md-6">
      {% if product.image %}
      <img src="{{ product.image.url }}" class="img-fluid rounded" alt="{{ product.name }}">
      {% else %}
      <img src="{% static 'image.jpg' %}" class="img-fluid rounded" alt="No image">
      {% endif %}
    </div>
    <div class="col-md-6">
      <h2>{{ product.name }}</h2>
      <p><strong>Price:</strong> ${{ product.price }}</p>
      <p><strong>Seller:</strong> <a href="/users/{{ product.user }}">{{ product.user }}</a></p>
      <p>{{ product.description }}</p>
      <a href="#" class="btn btn-primary btn-lg">Buy Now</a>
    </div>
  </div>
</div>
{% endblock %}
