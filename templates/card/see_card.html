{% extends "base.html" %}

{% block title %}
My Card
{% endblock title %}

{% block center %}
<h2>See your card here!</h2>
<table class="table table-hover table-striped table-bordered">
    <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Price</th>
        </tr>
    </thead>
    {% for item in items %}
    <tbody>
        <tr class="table-active" style="cursor: pointer;">
            <th scope="row">{{ item.product.name }}</th>
            <td>{{ item.product.price }} $</td>
            <td><a href="{% url 'remove_from_card' item.product.id item.user.id %}">X</a></td>
    {% endfor %}

        </tr>
        <tr>
            <th scope="row"></th>
            <td>Total:{{total}} $</td>
        </tr>
    </tbody>
</table>
<a href="{% url 'clear_card' %}" class="btn btn-info">Order</a>

{% endblock center %}
